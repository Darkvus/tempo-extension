name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome (MV3)
        run: npm run build

      - name: Build Firefox (MV2)
        run: npm run build:firefox

      - name: Zip Chrome
        run: npm run zip

      - name: Zip Firefox
        run: npm run zip:firefox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: "*.zip"
          retention-days: 14
